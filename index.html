<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#202124;background:#f4f6f8;font-size:15px}*{box-sizing:border-box}body{margin:0;padding:8px;max-width:900px;margin-inline:auto}.top{display:flex;align-items:center;gap:8px;min-height:34px;margin-bottom:8px}.version{font-size:13px;white-space:nowrap}.app-title{font-size:20px;font-weight:700;text-align:center;flex:1}.gear{border:0;background:transparent;font-size:22px;padding:2px 5px;line-height:1;cursor:pointer}.panel{border-radius:7px;padding:9px;margin:8px 0;border:1px solid #d3d7dc}.entry{background:#fff6c9}.ago{background:#ffe0e0;text-align:center;font-weight:600}.listing{background:#dceeff}.panel-title{font-weight:700;margin-bottom:7px}.list-heading{display:flex;align-items:center;gap:10px}.view-btn{font-size:13px;padding:3px 10px;min-height:27px;border:1px solid #7fa7c8;border-radius:4px;background:#bfe0fa;color:#202124}.view-btn.active{background:#6faedb;border-color:#397eae;box-shadow:inset 0 2px 3px #397eae;font-weight:700}.entryline{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:7px 0}.entryline label{white-space:nowrap}.entryline .med-group{margin-left:auto;display:flex;align-items:center;gap:6px;justify-content:flex-end;text-align:right}.entryline .field-group{display:flex;align-items:center;gap:6px}.med{width:24px;text-align:right}.date{width:122px}.time{width:75px}.field-group:has(.time){position:relative;left:10px;margin-right:-10px}.duration{width:43px;text-align:center;font-variant-numeric:tabular-nums}.entryline input{min-height:30px;padding:4px 5px;border:1px solid #999;border-radius:4px;background:white;font:inherit}.smallbtn{font-size:13px;padding:4px 8px;min-height:28px;border:1px solid #888;border-radius:4px;background:#f7f7f7}.record-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:0 0 0 auto}.timer-controls{display:flex;align-items:center;gap:8px;flex:0 0 auto}.tiny{width:25px;height:25px;padding:0;border:1px solid #777;border-radius:4px;background:#fff;font-weight:bold;font-size:17px;line-height:20px}.tiny:disabled{opacity:.35}.timer-controls #timerToggle{height:38px;position:relative;left:30px;width:88px;min-width:88px;background:#bfe0fa;border-color:#7fa7c8}.timer-controls #timerToggle.running{background:#6faedb;border-color:#397eae;box-shadow:inset 0 2px 3px #397eae;font-weight:700}.entryline.secondline{gap:10px}.entryline.secondline .field-group{flex:0 0 auto}.entryline.secondline .timer-controls{margin-left:0}.entryline.secondline .record-actions{margin-left:auto}.sticky-stack{position:sticky;top:0;z-index:5;background:#f4f6f8;padding-top:1px}.tablewrap{max-height:58vh;overflow:auto;overscroll-behavior:contain}table{border-collapse:collapse;width:max-content;min-width:100%;font-size:13px;table-layout:auto}th,td{overflow:visible;text-overflow:clip}th,td{padding:6px 7px;text-align:left;border-bottom:1px solid #b7cce0;white-space:nowrap}th{font-weight:700}#listTable.detail th:nth-child(1),#listTable.detail td:nth-child(1){text-align:center;width:20px}#listTable.detail th:nth-child(2),#listTable.detail td:nth-child(2){min-width:28px;text-align:center}#listTable.detail th:nth-child(3),#listTable.detail td:nth-child(3){min-width:42px;position:relative;left:5px;text-align:center}#listTable.detail th:nth-child(4),#listTable.detail td:nth-child(4){min-width:100px}#listTable.detail th:nth-child(5),#listTable.detail td:nth-child(5){min-width:62px}#listTable.detail th:nth-child(6),#listTable.detail td:nth-child(6){min-width:40px}#listTable.detail th:nth-child(7),#listTable.detail td:nth-child(7){min-width:75px}#listTable.detail th:nth-child(8),#listTable.detail td:nth-child(8){min-width:70px}#listTable.summary th:nth-child(1),#listTable.summary td:nth-child(1){min-width:76px;text-align:center}#listTable.summary th:nth-child(2),#listTable.summary td:nth-child(2){min-width:42px;text-align:center;position:relative;left:5px}#listTable.summary th:nth-child(3),#listTable.summary td:nth-child(3){min-width:120px;padding-left:27px}#listTable.summary th:nth-child(4),#listTable.summary td:nth-child(4){min-width:40px;text-align:center}#listTable.summary th:nth-child(5),#listTable.summary td:nth-child(5){min-width:75px}#listTable.summary th:nth-child(6),#listTable.summary td:nth-child(6){min-width:95px}#listTable.rollup th:nth-child(1),#listTable.rollup td:nth-child(1){min-width:65px}#listTable.rollup th:nth-child(2),#listTable.rollup td:nth-child(2){min-width:110px;position:relative;left:-50px}#listTable.rollup th:nth-child(3),#listTable.rollup td:nth-child(3){min-width:65px;text-align:right;position:relative;left:-200px}input[type=radio]{width:17px;height:17px;vertical-align:middle}.empty{text-align:center;padding:12px}.settings{display:none}.settings.visible{display:block}.main.hidden{display:none}.setting-row{display:flex;align-items:center;gap:8px}.back{padding:6px 13px;border:1px solid #888;border-radius:4px;background:#fff}.note{font-size:12px;color:#555;margin-top:6px}.ago small{font-weight:400}
.entry-help{font-size:11px;line-height:1.35;margin:5px 0 0;color:#555}
</style>
</head>
<body>
<header class="top"><span class="version">b1v17</span><div class="app-title">Usage</div><button class="gear" id="gear" aria-label="Settings" title="Settings">⚙</button></header>
<main class="main" id="main">
<div class="sticky-stack">
<section class="panel entry"><div class="panel-title">Data Entry</div>
<div class="entryline"><div class="field-group"><label for="date"><b>Date:</b></label><input id="date" class="date" type="date" required></div><div class="field-group"><label for="time"><b>Time:</b></label><input id="time" class="time" type="text" placeholder="hh:mm AM/PM" aria-label="Time (hh:mm AM/PM)" required></div><div class="med-group"><label for="med"><b>Med:</b></label><input id="med" class="med" type="number" min="1" step="1" required inputmode="numeric"></div></div>
<div class="entryline secondline"><div class="field-group"><label for="duration"><b>Duration:</b></label><input id="duration" class="duration" type="text" value="1:00" maxlength="4" inputmode="numeric" aria-label="Duration m:ss"></div><div class="timer-controls"><button class="smallbtn" id="timerToggle" type="button">Start</button></div><div class="record-actions"><button class="tiny" id="add" title="Add" aria-label="Add">+</button><button class="tiny" id="update" title="Update selected record" aria-label="Update" disabled>*</button><button class="tiny" id="remove" title="Delete selected record" aria-label="Delete" disabled>-</button></div></div>
<p class="entry-help">To Change, select a row to load into the display; change the data; press the "*" button to save.</p>
</section>
<section class="panel ago"><div id="usedAgo">No usage records yet.</div></section>
</div>
<section class="panel listing"><div class="panel-title list-heading"><span>Data List</span><button class="view-btn active" id="detailView" type="button" aria-pressed="true">Detail</button><button class="view-btn" id="summaryView" type="button" aria-pressed="false">Summary</button><button class="view-btn" id="rollupView" type="button" aria-pressed="false">Roll-up</button></div><div class="tablewrap"><table id="listTable" class="detail"><thead id="listHead"><tr><th></th><th></th><th>Date</th><th>Time</th><th>Med</th><th>Last Diff</th><th>Duration</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="empty">No records to display.</td></tr></tbody></table></div></section>
</main>
<section class="panel settings" id="settings"><div class="panel-title">Settings</div><div class="setting-row"><button class="back" id="back">Back</button><button class="back" id="exportJson">Export</button><button class="back" id="importJson">Import</button><input id="jsonFile" type="file" accept=".json,application/json" hidden></div><p class="note">Usage data is stored on this device in the ManageDB SQLite database.</p></section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script>
(()=>{
'use strict';
const DB_KEY='usage-managedb-sqlite-v1';let db=null,selectedId=null,saveTimer=null,viewMode='detail',timerElapsedMs=0,timerStartedAt=null,timerInterval=null,timeEdited=false;
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
function today(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function formatTime(d){return `${pad((d.getHours()+11)%12+1)}:${pad(d.getMinutes())} ${d.getHours()<12?'AM':'PM'}`}
function parseTime(s){const m=String(s).trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);if(!m)return null;let h=+m[1],mi=+m[2];if(h<1||h>12||mi>59)return null;h=h%12+(m[3].toUpperCase()==='PM'?12:0);return `${pad(h)}:${pad(mi)}`}
function displayTime(s){const [h,m]=s.split(':').map(Number);return `${pad((h+11)%12+1)}:${pad(m)} ${h<12?'AM':'PM'}`}
function dateObj(date,time){const [h,m]=time.split(':').map(Number);const [y,mo,day]=date.split('-').map(Number);return new Date(y,mo-1,day,h,m,0,0)}
function fmtDiff(ms){let mins=Math.max(0,Math.floor(ms/60000)),h=Math.floor(mins/60),m=mins%60;if(h&&m)return `${h}h ${m}m`;if(h)return `${h}h`;return `${m}m`}
function durationSeconds(){const m=$('duration').value.trim().match(/^(\d):([0-5]\d|60)$/);if(!m)return null;return +m[1]*60 + +m[2]}
function setDuration(total){total=Math.max(0,Math.min(599,total));$('duration').value=`${Math.floor(total/60)}:${pad(total%60)}`}
function currentElapsedMs(){return timerElapsedMs+(timerStartedAt===null?0:Math.max(0,performance.now()-timerStartedAt))}
function renderTimer(){const ms=Math.min(599999,Math.floor(currentElapsedMs()));const totalSeconds=Math.floor(ms/1000);$('duration').value=`${Math.floor(totalSeconds/60)}:${pad(totalSeconds%60)}`}
function stopTimer(){if(timerInterval!==null){timerElapsedMs=Math.min(599999,currentElapsedMs());timerStartedAt=null;clearInterval(timerInterval);timerInterval=null}$('timerToggle').textContent='Start';$('timerToggle').classList.remove('running');renderTimer()}
function resetTimer(){if(timerInterval!==null){clearInterval(timerInterval);timerInterval=null}timerElapsedMs=0;timerStartedAt=null;$('timerToggle').textContent='Start';$('timerToggle').classList.remove('running');renderTimer()}
$('timerToggle').addEventListener('click',()=>{if(timerInterval!==null){stopTimer();$('add').click();return}timerStartedAt=performance.now();$('timerToggle').textContent='Stop';$('timerToggle').classList.add('running');renderTimer();timerInterval=setInterval(()=>{renderTimer();if(currentElapsedMs()>=599999)stopTimer()},10)});
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveDb,100)}
async function saveDb(){if(!db)return;const bytes=db.export();const tx=await new Promise((resolve,reject)=>{const t=indexedDB.open('UsageLocalStore',1);t.onupgradeneeded=()=>t.result.createObjectStore('db');t.onsuccess=()=>resolve(t.result);t.onerror=()=>reject(t.error)});await new Promise((resolve,reject)=>{const t=tx.transaction('db','readwrite');t.objectStore('db').put(bytes,DB_KEY);t.oncomplete=resolve;t.onerror=()=>reject(t.error)});tx.close()}
async function loadDb(){const SQL=await initSqlJs({locateFile:f=>`https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}`});const req=indexedDB.open('UsageLocalStore',1);const store=await new Promise((resolve,reject)=>{req.onupgradeneeded=()=>req.result.createObjectStore('db');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});const bytes=await new Promise((resolve,reject)=>{const r=store.transaction('db').objectStore('db').get(DB_KEY);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});store.close();db=bytes?new SQL.Database(new Uint8Array(bytes)):new SQL.Database();db.run('CREATE TABLE IF NOT EXISTS "Usage" ("ID" INTEGER PRIMARY KEY AUTOINCREMENT UNIQUE NOT NULL, "Med" INTEGER NOT NULL CHECK("Med">0), "Date" TEXT NOT NULL, "Time" TEXT NOT NULL, "Duration" TEXT NOT NULL)');scheduleSave();}
function query(sql,params=[]){const st=db.prepare(sql);st.bind(params);const out=[];while(st.step())out.push(st.getAsObject());st.free();return out}
function setEntry(r){$('med').value=r.Med;$('date').value=r.Date;$('time').value=displayTime(r.Time);$('duration').value=r.Duration;selectedId=r.ID;$('update').disabled=false;$('remove').disabled=false;renderRows()}
function clearSelection(){selectedId=null;$('update').disabled=true;$('remove').disabled=true;renderRows()}
function dayAbbr(date){const [y,m,d]=date.split('-').map(Number);return ['Su','Mo','Tu','We','Th','Fr','Sa'][new Date(y,m-1,d).getDay()]}
function durationValue(value){const m=String(value).match(/^(\d):([0-5]\d|60)$/);return m?Number(m[1])*60+Number(m[2]):0}
function formatDuration(seconds){const n=Math.max(0,Math.round(seconds));return `${Math.floor(n/60)}:${pad(n%60)}`}
function setView(mode){viewMode=mode;for(const [id,m] of [['detailView','detail'],['summaryView','summary'],['rollupView','rollup']]){const b=$(id),active=m===mode;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))}if(mode!=='detail'){selectedId=null;$('update').disabled=true;$('remove').disabled=true}renderRows()}
function renderRows(){
 const records=query('SELECT "ID","Med","Date","Time","Duration" FROM "Usage" ORDER BY "Date" DESC,"Time" DESC,"ID" DESC');
 const body=$('rows'),head=$('listHead'),table=$('listTable');body.innerHTML='';
 if(viewMode==='detail'){
  table.className='detail';
  const counts=new Map();let runningDate=null,runningCount=0;for(const r of [...records].reverse()){if(r.Date!==runningDate){runningDate=r.Date;runningCount=0}runningCount++;counts.set(r.ID,runningCount)}
  head.innerHTML='<tr><th>Total:</th><th>'+records.length+'</th><th>Day</th><th>Date</th><th>Time</th><th>Med</th><th>Last Diff</th><th>Duration</th></tr>';
  if(!records.length){body.innerHTML='<tr><td colspan="8" class="empty">No records to display.</td></tr>';return}
  records.forEach((r,i)=>{let diff='—';if(i<records.length-1){const newer=dateObj(r.Date,r.Time),older=dateObj(records[i+1].Date,records[i+1].Time);diff=fmtDiff(newer-older)}const tr=document.createElement('tr');if(r.ID===selectedId)tr.className='selected';const radio=document.createElement('input');radio.type='radio';radio.name='selectedRecord';radio.checked=r.ID===selectedId;radio.addEventListener('change',()=>setEntry(r));const td0=document.createElement('td');td0.append(radio);tr.append(td0);[counts.get(r.ID),dayAbbr(r.Date),r.Date,displayTime(r.Time),r.Med,diff,r.Duration].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});body.append(tr)});
 }else if(viewMode==='summary'){
  table.className='summary';head.innerHTML='<tr><th>Days: 0</th><th>Day</th><th>Date</th><th>Med</th><th>Avg. Dur.</th><th>Avg Last Diff</th></tr>';
  if(!records.length){body.innerHTML='<tr><td colspan="6" class="empty">No records to display.</td></tr>';return}
  const groups=new Map();records.forEach((r,i)=>{let g=groups.get(r.Date);if(!g){g={date:r.Date,count:0,med:r.Med,durations:0,diffTotal:0,diffN:0};groups.set(r.Date,g)}g.count++;g.durations+=durationValue(r.Duration);if(i<records.length-1){const next=records[i+1];if(next.Date===r.Date){g.diffTotal+=Math.max(0,dateObj(r.Date,r.Time)-dateObj(next.Date,next.Time))/60000;g.diffN++}}});
  head.querySelector('th:nth-child(1)').textContent='Days: '+groups.size;
  for(const g of groups.values()){const tr=document.createElement('tr');[g.count,dayAbbr(g.date),g.date,g.med,formatDuration(g.durations/g.count),g.diffN?fmtDiff(g.diffTotal/g.diffN*60000):'—'].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});body.append(tr)}
 }else{
  table.className='rollup';head.innerHTML='<tr><th>Med</th><th>Date</th><th>Count</th></tr>';
  if(!records.length){body.innerHTML='<tr><td colspan="3" class="empty">No records to display.</td></tr>';return}
  const groups=new Map();for(const r of records){let g=groups.get(r.Med);if(!g)groups.set(r.Med,g={med:r.Med,date:r.Date,count:0,firstKey:r.Date+' '+r.Time});g.count++;const key=r.Date+' '+r.Time;if(key<g.firstKey){g.firstKey=key;g.date=r.Date}}
  for(const g of [...groups.values()].sort((a,b)=>Number(a.med)-Number(b.med))){const tr=document.createElement('tr');[g.med,g.date,g.count].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});body.append(tr)}
 }
}
$('detailView').addEventListener('click',()=>setView('detail'));
$('summaryView').addEventListener('click',()=>setView('summary'));
$('rollupView').addEventListener('click',()=>setView('rollup'));
function renderAgo(){const r=query('SELECT "Date","Time" FROM "Usage" ORDER BY "Date" DESC,"Time" DESC,"ID" DESC LIMIT 1')[0];if(!r){$('usedAgo').textContent='No usage records yet.';return}const mins=Math.max(0,Math.floor((Date.now()-dateObj(r.Date,r.Time))/60000)),h=Math.floor(mins/60),m=mins%60;let msg='Last used ';if(h&&m)msg+=`${h} ${h===1?'hour':'hours'} and ${m} ${m===1?'minute':'minutes'} ago`;else if(h)msg+=`${h} ${h===1?'hour':'hours'} ago`;else msg+=`${m} ${m===1?'minute':'minutes'} ago`;$('usedAgo').textContent=msg}
function refresh(){renderRows();renderAgo()}
function initEntry(){const latest=query('SELECT "Med" FROM "Usage" ORDER BY "ID" DESC LIMIT 1')[0];$('med').value=latest?latest.Med:'';$('date').value=today();$('time').value=formatTime(new Date());timeEdited=false;$('duration').value='1:00';clearSelection()}
function validate(){const med=Number($('med').value),date=$('date').value,time=parseTime($('time').value),dur=durationSeconds();if(!Number.isInteger(med)||med<=0){alert('Med must be a positive integer.');$('med').focus();return null}if(!date){alert('Date is required.');return null}if(!time){alert('Enter Time as hh:mm AM/PM.');$('time').focus();return null}if(dur===null){alert('Duration must be m:ss, with seconds from 00 to 60.');$('duration').focus();return null}return {med,date,time,duration:`${Math.floor(dur/60)}:${pad(dur%60)}`}}
$('add').addEventListener('click',()=>{const v=validate();if(!v)return;resetTimer();db.run('INSERT INTO "Usage" ("Med","Date","Time","Duration") VALUES (?,?,?,?)',[v.med,v.date,v.time,v.duration]);selectedId=null;scheduleSave();initEntry();$('med').value=v.med;refresh()});
$('update').addEventListener('click',()=>{if(selectedId===null)return;const v=validate();if(!v)return;db.run('UPDATE "Usage" SET "Med"=?,"Date"=?,"Time"=?,"Duration"=? WHERE "ID"=?',[v.med,v.date,v.time,v.duration,selectedId]);scheduleSave();refresh()});
$('remove').addEventListener('click',()=>{if(selectedId===null)return;if(!confirm('Delete the selected Usage record?'))return;db.run('DELETE FROM "Usage" WHERE "ID"=?',[selectedId]);selectedId=null;scheduleSave();initEntry();refresh()});
$('duration').addEventListener('blur',()=>{const n=durationSeconds();if(n!==null)setDuration(n)});
$('time').addEventListener('input',()=>{timeEdited=true;});$('time').addEventListener('blur',()=>{const p=parseTime($('time').value);if(p)$('time').value=displayTime(p);});
$('gear').addEventListener('click',()=>{$('main').classList.add('hidden');$('settings').classList.add('visible')});$('back').addEventListener('click',()=>{$('settings').classList.remove('visible');$('main').classList.remove('hidden')});
function bytesToBase64(bytes){let binary='';const chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk)binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));return btoa(binary)}
function base64ToBytes(value){const binary=atob(value);const bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return bytes}
$('exportJson').addEventListener('click',()=>{try{const payload={format:'Usage-ManageDB-SQLite',formatVersion:1,exportedAt:new Date().toISOString(),databaseBase64:bytesToBase64(db.export())};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Usage-ManageDB-'+today()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){alert('The database could not be exported: '+e.message)}});
$('importJson').addEventListener('click',()=>$('jsonFile').click());
$('jsonFile').addEventListener('change',async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;try{const payload=JSON.parse(await file.text());if(payload.format!=='Usage-ManageDB-SQLite'||payload.formatVersion!==1||typeof payload.databaseBase64!=='string')throw new Error('This is not a supported Usage database backup.');if(!confirm('Import this JSON database and replace the current Usage records? Export your current data first if you want to keep a separate backup.'))return;const SQL=await initSqlJs({locateFile:f=>`https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}`});const imported=new SQL.Database(base64ToBytes(payload.databaseBase64));const tableCheck=imported.exec("SELECT name FROM sqlite_master WHERE type='table' AND name='Usage'");if(!tableCheck.length||!tableCheck[0].values.length)throw new Error('The backup does not contain the Usage table.');const cols=imported.exec('PRAGMA table_info(\"Usage\")')[0]?.values.map(row=>row[1])||[];if(!['ID','Med','Date','Time','Duration'].every(c=>cols.includes(c)))throw new Error('The Usage table does not have the expected columns.');db.close();db=imported;await saveDb();selectedId=null;initEntry();refresh();alert('Usage database imported successfully.')}catch(err){alert('The JSON file could not be imported: '+err.message)}finally{e.target.value=''}});
(async()=>{try{await loadDb();initEntry();refresh();setInterval(()=>{if(selectedId===null&&!timeEdited&&document.activeElement!==$('time'))$('time').value=formatTime(new Date());},1000);setInterval(renderAgo,30000);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});}catch(e){console.error(e);alert('The Usage database could not be opened. Please reload the app.')}})();
})();
</script>
</body></html>
